name: Update publications page

# Keeps the page current on its own: re-fetch from OpenAlex, rebuild index.html,
# and commit any changes. Pushing to `main` makes GitHub Pages republish.

on:
  schedule:
    # Every Friday at 15:00 UTC = 08:00 Pacific (PDT) / 07:00 (PST) — Friday
    # morning in Seattle. Cron is always UTC and does not follow daylight-saving,
    # so the local time shifts by an hour across DST. GitHub may also delay
    # scheduled runs by a few minutes.
    - cron: "0 15 * * 5"
  workflow_dispatch: {}   # also lets you run it on demand from the Actions tab

# Allow the job's GITHUB_TOKEN to push the refreshed files back to the repo.
permissions:
  contents: write

# Never let two refreshes run at once.
concurrency:
  group: update-page
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch_papers.py and build_page.py use only the Python standard library,
      # so there is nothing to pip install.
      - name: Fetch latest papers from OpenAlex
        run: python -X utf8 fetch_papers.py

      - name: Rebuild the page
        run: python -X utf8 build_page.py

      # Surface any papers the name guard held out (returned for the ORCID but
      # missing your name) as a visible warning + run summary, so a possible
      # mis-attribution never slips onto the page unnoticed.
      - name: Report papers held out by the name guard
        run: |
          flagged=$(grep -vE '^[[:space:]]*#' flagged_works.txt | grep -vE '^[[:space:]]*$' || true)
          if [ -n "$flagged" ]; then
            {
              echo "### ⚠️ Papers held out for review"
              echo "Returned for this ORCID but they do **not** list your name, so they were kept off the page:"
              echo ""
              echo '```'
              echo "$flagged"
              echo '```'
              echo "If one is genuinely yours, add its id to \`confirmed_mine.txt\`."
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=Possible mis-attributed paper::$line"
            done <<< "$flagged"
          else
            echo "✓ Name guard: every shown work lists your name — nothing held out." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain index.html papers.json papers.csv flagged_works.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html papers.json papers.csv flagged_works.txt
            git commit -m "chore: weekly refresh of publications from OpenAlex"
            git push
            echo "Page updated and pushed — GitHub Pages will republish."
          else
            echo "No changes — publications and citation counts are already up to date."
          fi
